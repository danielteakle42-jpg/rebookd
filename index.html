<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#102825" />
  <meta name="description" content="Rebookd — last-minute bookings from trusted businesses." />
  <title>Rebookd</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <div id="toast" class="toast" role="status"></div>
  <div class="shell">
    <header class="topbar">
      <button class="brand" data-route="home" aria-label="Rebookd home">
        <img src="assets/rebookd-logo.jpg" alt="Rebookd logo" />
        <span class="brand-copy"><strong>Rebookd</strong><small>Last-minute bookings</small></span>
      </button>
      <div class="header-actions">
        <button class="icon-btn location-pill" id="locationBtn" title="Search location"><span>⌖</span><span id="locationText">Anywhere</span></button>
        <button class="icon-btn" data-route="notifications" title="Notifications">♢<b id="notificationCount" class="counter hidden">0</b></button>
        <button class="avatar-btn" data-route="profile" id="avatarBtn">R</button>
      </div>
    </header>
    <main id="app"><section class="section"><div class="empty">Loading Rebookd…</div></section></main>
    <nav class="bottom-nav" id="bottomNav" aria-label="Primary navigation">
      <button data-route="home"><i>⌂</i><span>Home</span></button>
      <button data-route="explore"><i>⌕</i><span>Explore</span></button>
      <button data-route="bookings"><i>▣</i><span>Bookings</span></button>
      <button data-route="saved"><i>♡</i><span>Saved</span></button>
      <button data-route="profile"><i>○</i><span>Profile</span></button>
    </nav>
  </div>
  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" data-close-modal aria-label="Close">×</button>
      <div id="modalContent"></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
